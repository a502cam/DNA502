<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بريد الدواسر | mail.a502.cam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0f14;
      --card: #121821;
      --gold: #d4af37;
      --gold-soft: rgba(212, 175, 55, 0.14);
      --text: #f4f6f8;
      --muted: #9aa5b4;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Cairo", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }
    header {
      border-bottom: 1px solid var(--border);
      padding: 1.1rem 0;
    }
    .container { width: min(1000px, 92%); margin-inline: auto; }
    .nav { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-weight: 800; font-size: 1.15rem; color: var(--gold); }
    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 3rem 0;
    }
    .box {
      width: 100%;
      max-width: 540px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2rem;
    }
    .badge {
      display: inline-block;
      background: var(--gold-soft);
      color: var(--gold);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
    }
    h1 { font-size: 1.65rem; margin-bottom: 0.5rem; }
    p { color: var(--muted); margin-bottom: 1.5rem; font-size: 0.95rem; }
    .list { display: grid; gap: 0.85rem; margin-bottom: 1.5rem; }
    .item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.9rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.92rem;
    }
    .copy-btn {
      background: var(--gold);
      color: #0b0f14;
      border: none;
      border-radius: 8px;
      padding: 0.4rem 0.8rem;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .status { color: var(--gold); font-size: 0.88rem; min-height: 1.3rem; }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <a href="https://a502.cam" class="brand">بريد الدواسر • MAIL</a>
      <a href="https://a502.cam" style="color: var(--muted); font-size: 0.9rem;">العودة للرئيسية</a>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="box">
        <span class="badge">mail.a502.cam</span>
        <h1>بوابة البريد والمراسلات</h1>
        <p>عناوين البريد الرسمية المرتبطة بالنطاق <strong>a502.cam</strong>.</p>

        <div class="list">
          <div class="item">
            <span id="mail1">info@a502.cam</span>
            <button class="copy-btn" onclick="copyText('mail1')">نسخ</button>
          </div>
          <div class="item">
            <span id="mail2">contact@a502.cam</span>
            <button class="copy-btn" onclick="copyText('mail2')">نسخ</button>
          </div>
        </div>

        <div class="status" id="statusMsg"></div>
      </div>
    </div>
  </main>

  <script>
    function copyText(id) {
      const text = document.getElementById(id).textContent.trim();
      navigator.clipboard?.writeText(text);
      document.getElementById("statusMsg").textContent = `تم نسخ العنوان: ${text}`;
    }
  </script>
</body>
</html>
